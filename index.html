<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Javitotv</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
}

header{
    background:#1d1d1d;
    padding:30px;
    text-align:center;
    border-bottom:4px solid orange;
}

h1{
    font-size:42px;
}

main{
    padding:30px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:20px;
}

.app{
    background:#222;
    padding:25px;
    border-radius:15px;
    text-align:center;
}

a{
    display:block;
    background:orange;
    color:white;
    padding:15px;
    text-decoration:none;
    border-radius:10px;
    font-weight:bold;
}
</style>

</head>

<body>

<header>
<h1>🔥 JAVITOTV</h1>
<p>Biblioteca Fire TV y Android TV</p>
</header>

<main>

<h2>📺 TV e IPTV</h2>

<div class="grid">

<div class="app">
<h3>Sparkle TV</h3>
<a href="#">INSTALAR</a>
</div>

<div class="app">
<h3>XCIPTV</h3>
<a href="#">INSTALAR</a>
</div>

<div class="app">
<h3>TiviMate</h3>
<a href="#">INSTALAR</a>
</div>

<div class="app">
<h3>IPTV Smarters</h3>
<a href="#">INSTALAR</a>
</div>

</div>

<br><br>

<h2>🎬 Multimedia</h2>

<div class="grid">

<div class="app">
<h3>VLC</h3>
<a href="#">INSTALAR</a>
</div>

<div class="app">
<h3>Kodi</h3>
<a href="#">INSTALAR</a>
</div>

<div class="app">
<h3>MX Player</h3>
<a href="#">INSTALAR</a>
</div>

</div>

</main>

</body>
</html>
